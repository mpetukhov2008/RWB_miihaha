# Docker Compose для сгенерированного результата (generated/<case>/).
# Запуск: docker compose -f infra/docker-compose.yml up --build
version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ../db/seed:/docker-entrypoint-initdb.d/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Username=${POSTGRES_USER:-app};Password=${POSTGRES_PASSWORD:-app};Database=${POSTGRES_DB:-app}"
      Jwt__Issuer: ${JWT_ISSUER:-api.local}
      Jwt__Audience: ${JWT_AUDIENCE:-app}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-change-me}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ../frontend-admin
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
