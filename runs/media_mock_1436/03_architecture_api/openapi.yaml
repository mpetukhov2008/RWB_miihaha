openapi: 3.1.0
info:
  title: API
  version: 1.0.0
  description: Сгенерировано из системной модели
paths:
  /zones/{zoneId}:
    get:
      operationId: getZone
      summary: Получить зону
      tags:
      - zones
      x-requirement-ids:
      - FR-001
      responses:
        '404':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /sessions:
    post:
      operationId: startSession
      summary: Начать сессию
      tags:
      - sessions
      x-requirement-ids:
      - FR-001
      - FR-002
      - FR-005
      responses:
        '400':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zoneId:
                  type: string
      security:
      - bearerAuth: []
    get:
      operationId: listSessions
      summary: История сессий
      tags:
      - sessions
      x-requirement-ids:
      - FR-004
      responses: {}
      security:
      - bearerAuth: []
  /sessions/{sessionId}/complete:
    post:
      operationId: completeSession
      summary: Завершить сессию
      tags:
      - sessions
      x-requirement-ids:
      - FR-002
      - FR-005
      responses:
        '404':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /admin/zones:
    post:
      operationId: createZone
      summary: Создать зону
      tags:
      - admin
      - zones
      x-requirement-ids:
      - FR-006
      - NFR-002
      responses:
        '400':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
