openapi: 3.1.0
info:
  title: API
  version: 1.0.0
  description: Сгенерировано из системной модели
paths:
  /auth/login:
    post:
      operationId: login
      summary: Аутентификация пользователя.
      tags:
      - auth
      x-requirement-ids:
      - NFR-002
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
  /zones/nearby:
    get:
      operationId: getNearbyZone
      summary: Определение платной зоны по геолокации.
      tags:
      - zones
      x-requirement-ids:
      - FR-001
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /sessions:
    post:
      operationId: startSession
      summary: Начать парковочную сессию.
      tags:
      - sessions
      x-requirement-ids:
      - FR-002
      - FR-005
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_id:
                  type: string
                location:
                  type: object
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
              required:
              - zone_id
      security:
      - bearerAuth: []
  /sessions/active:
    get:
      operationId: getActiveSession
      summary: Получить активную сессию текущего водителя.
      tags:
      - sessions
      x-requirement-ids:
      - FR-002
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /sessions/{session_id}/end:
    post:
      operationId: endSession
      summary: Завершить парковочную сессию.
      tags:
      - sessions
      x-requirement-ids:
      - FR-002
      - FR-005
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /sessions/history:
    get:
      operationId: getSessionHistory
      summary: История парковочных сессий водителя.
      tags:
      - sessions
      x-requirement-ids:
      - FR-004
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /notifications:
    get:
      operationId: getNotifications
      summary: Список уведомлений текущего водителя.
      tags:
      - notifications
      x-requirement-ids:
      - FR-003
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /admin/zones:
    get:
      operationId: adminListZones
      summary: Список всех зон (админ).
      tags:
      - admin
      - zones
      x-requirement-ids:
      - FR-006
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
    post:
      operationId: adminCreateZone
      summary: Создать зону (админ).
      tags:
      - admin
      - zones
      x-requirement-ids:
      - FR-006
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                polygon:
                  type: string
                rate_per_hour:
                  type: number
              required:
              - name
              - polygon
              - rate_per_hour
      security:
      - bearerAuth: []
  /admin/zones/{zone_id}:
    put:
      operationId: adminUpdateZone
      summary: Редактировать зону (админ).
      tags:
      - admin
      - zones
      x-requirement-ids:
      - FR-006
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                polygon:
                  type: string
                rate_per_hour:
                  type: number
                is_active:
                  type: boolean
      security:
      - bearerAuth: []
  /admin/sessions:
    get:
      operationId: adminListSessions
      summary: Список активных сессий (админ).
      tags:
      - admin
      - sessions
      x-requirement-ids:
      - FR-006
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /admin/sessions/history:
    get:
      operationId: adminSessionHistory
      summary: История сессий по зоне (админ).
      tags:
      - admin
      - sessions
      x-requirement-ids:
      - FR-006
      responses:
        '401':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Ошибка
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
